name: "Auto Author Assign"
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  assign:
    # GITHUB_TOKEN is forced read-only for pull_request events from forks, so the
    # assign API call would 403. Fork authors are not assignable here anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: toshimaru/auto-author-assign@a78a94b219445cece8ccf0d45fec60af449f212a # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
